<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>القرآن الكريم — Holy Quran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d0f12;
      /* Solid, non-translucent dock colors */
      --card-bg: #141822;
      --card-hover-bg: #1a202e;
      --border: rgba(212, 175, 55, 0.35);
      --border-hover: rgba(212, 175, 55, 0.6);
      --accent: #d4af37;
      --accent-hover: #f3cf65;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --page-width: 95vw;
      --page-max-width: 1350px;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Reading Tone Filters */
    body.mode-dark { --bg: #050608; }
    body.mode-dark .quran-page { filter: invert(0.92) hue-rotate(180deg) contrast(1.12) brightness(0.92); }
    body.mode-sepia { --bg: #181512; }
    body.mode-sepia .quran-page { filter: sepia(0.4) contrast(1.05) brightness(0.95); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Continuous Vertical Scroll Container */
    #scrollContainer {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Small gap below the browser bookmark bar */
      padding-top: 14px;
      padding-bottom: 110px;
    }

    /* Sleek Custom Scrollbar */
    #scrollContainer::-webkit-scrollbar {
      width: 6px;
    }
    #scrollContainer::-webkit-scrollbar-track {
      background: transparent;
    }
    #scrollContainer::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.25);
      border-radius: 999px;
    }
    #scrollContainer::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* Feed Container: Minimized 8px gap between pages */
    #pagesFeed {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 8px;
    }

    /* Wide Quran Page Wrapper */
    .page-wrapper {
      width: var(--page-width);
      max-width: var(--page-max-width);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      content-visibility: auto;
      contain-intrinsic-size: 1000px 1500px;
      /* Preserves the 14px top gap when jumping to any page */
      scroll-margin-top: 14px;
    }

    .quran-page {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      background-color: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      image-rendering: high-quality;
      min-height: 400px;
    }

    /* Bottom Floating Toolbar */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      pointer-events: none;
    }

    .bottom-bar.hidden {
      transform: translateY(120%);
      opacity: 0;
    }

    /* Solid (Non-Translucent) Dock Container */
    .dock-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.35rem 0.65rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85), 0 2px 8px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 0.45rem;
      pointer-events: auto;
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }

    .dock-container:hover {
      background: var(--card-hover-bg);
      border-color: var(--border-hover);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.95), 0 0 20px rgba(212, 175, 55, 0.2);
    }

    /* Bottom Micro-Progress Bar */
    .progress-line {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-hover));
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px var(--accent);
    }

    .dock-section {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dock-divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 0.1rem;
    }

    /* Button Styles */
    .btn {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 0.4rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(212, 175, 55, 0.18);
      color: var(--accent-hover);
    }

    .btn-index {
      font-family: 'Amiri', serif;
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--accent);
      padding: 0.25rem 0.65rem;
    }

    .btn-icon {
      padding: 0.45rem;
      width: 34px;
      height: 34px;
      justify-content: center;
    }

    /* Modern Smart Collapsible Page Slider */
    .slider-smart-wrapper {
      display: flex;
      align-items: center;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      margin: 0;
      transition: max-width 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, margin 0.35s ease;
    }

    .dock-container:hover .slider-smart-wrapper,
    .slider-smart-wrapper.expanded {
      max-width: 260px;
      opacity: 1;
      margin: 0 0.4rem;
    }

    .page-slider {
      width: 130px;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 99px;
    }

    .page-input-wrapper {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.85rem;
      direction: ltr;
      white-space: nowrap;
      margin-left: 0.4rem;
    }

    .page-input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--text);
      width: 44px;
      text-align: center;
      border-radius: 6px;
      padding: 0.18rem 0.25rem;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .page-input:focus {
      outline: 1px solid var(--accent);
    }

    /* Compact Page Pill Badge */
    .btn-page-pill {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--accent-hover);
      padding: 0.3rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-page-pill:hover {
      background: rgba(212, 175, 55, 0.26);
      border-color: var(--accent);
    }

    .total-pages-label {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.75rem;
      direction: ltr;
    }

    /* Surah Quick-Picker Drawer (Solid) */
    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      right: -360px;
      width: 340px;
      background: #141822;
      border-left: 1px solid var(--border);
      z-index: 100;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 35px rgba(0,0,0,0.85);
    }

    .drawer.open { right: 0; }

    .drawer-header {
      padding: 1.25rem 1rem 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-title {
      font-family: 'Amiri', serif;
      font-size: 1.3rem;
      color: var(--accent);
    }

    .drawer-search {
      margin: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
    }

    .drawer-search:focus {
      outline: 1px solid var(--accent);
    }

    .surah-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0.5rem;
    }

    .surah-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .surah-item:hover {
      background: rgba(212, 175, 55, 0.18);
      color: var(--accent-hover);
    }

    .surah-num {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }

    .surah-page {
      font-size: 0.8rem;
      color: var(--accent);
      direction: ltr;
    }
  </style>
</head>
<body>
  <!-- Continuous Infinite Vertical Scroll Container -->
  <main id="scrollContainer">
    <div id="pagesFeed"></div>
  </main>

  <!-- Modern Solid Floating Toolbar -->
  <footer class="bottom-bar" id="bottomBar">
    <div class="dock-container" id="dockContainer">
      <!-- Micro Golden Progress Indicator Line -->
      <div class="progress-line" id="progressLine"></div>

      <!-- Controls: Surah List, Theme, Fullscreen -->
      <div class="dock-section">
        <button class="btn btn-index" id="btnIndex" title="فهرس السور">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h7"></path></svg>
          <span>الفهرس</span>
        </button>

        <button class="btn btn-icon" id="btnTheme" title="تغيير النمط (عادي / ليلي / قديم)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>

        <button class="btn btn-icon" id="btnFullscreen" title="شاشة كاملة (F)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        </button>
      </div>

      <div class="dock-divider"></div>

      <!-- Navigation & Smart Expandable Slider -->
      <div class="dock-section">
        <button class="btn btn-icon" id="btnNext" title="الصفحة التالية">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>

        <!-- Compact Page Indicator Pill -->
        <button class="btn-page-pill" id="btnPagePill" title="انقر لإظهار شريط التمرير">
          <span id="pillPageText">ص 1</span>
          <span class="total-pages-label">/ 604</span>
        </button>

        <!-- Smart Collapsible Slider & Direct Input -->
        <div class="slider-smart-wrapper" id="sliderWrapper">
          <input type="range" class="page-slider" id="pageSlider" min="1" max="604" value="1" dir="ltr" />
          <div class="page-input-wrapper">
            <input type="number" class="page-input" id="pageInput" min="1" max="604" value="1" />
          </div>
        </div>

        <button class="btn btn-icon" id="btnPrev" title="الصفحة السابقة">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- Surah Quick-Picker Drawer -->
  <aside class="drawer" id="surahDrawer">
    <div class="drawer-header">
      <span class="drawer-title">سور القرآن الكريم</span>
      <button class="btn btn-icon" id="btnCloseDrawer">✕</button>
    </div>
    <input type="text" class="drawer-search" id="searchSurah" placeholder="ابحث عن سورة..." />
    <ul class="surah-list" id="surahList"></ul>
  </aside>

  <script>
    (function () {
      const TOTAL_PAGES = 604;
      const STORAGE_KEY = 'oxpc3_quran_page';

      function getPageUrl(page) {
        return `./img/page${String(page).padStart(3, '0')}.webp`;
      }

      const SURAHS = [

        { n: 9, name: "التوبة", page: 187 }, { n: 10, name: "يونس", page: 208 },
        { n: 11, name: "هود", page: 221 }, { n: 12, name: "يوسف", page: 235 },
        { n: 13, name: "الرعد", page: 249 }, { n: 14, name: "إبراهيم", page: 255 },

        { n: 17, name: "الإسراء", page: 282 }, { n: 18, name: "الكهف", page: 293 },
        { n: 19, name: "مريم", page: 305 }, { n: 20, name: "طه", page: 312 },
        { n: 21, name: "الأنبياء", page: 322 }, { n: 22, name: "الحج", page: 332 },
        { n: 23, name: "المؤمنون", page: 342 }, { n: 24, name: "النور", page: 350 },
        { n: 25, name: "الفرقان", page: 359 }, { n: 26, name: "الشعراء", page: 367 },
        { n: 27, name: "النمل", page: 377 }, { n: 28, name: "القصص", page: 385 },
        { n: 29, name: "العنكبوت", page: 396 }, { n: 30, name: "الروم", page: 404 },
        { n: 31, name: "لقمان", page: 411 }, { n: 32, name: "السجدة", page: 415 },
        { n: 33, name: "الأحزاب", page: 418 }, { n: 34, name: "سبأ", page: 428 },
        { n: 35, name: "فاطر", page: 434 }, { n: 36, name: "يس", page: 440 },
        { n: 37, name: "الصافات", page: 446 }, { n: 38, name: "ص", page: 453 },
        { n: 39, name: "الزمر", page: 458 }, { n: 40, name: "غافر", page: 467 },
        { n: 41, name: "فصلت", page: 477 }, { n: 42, name: "الشورى", page: 483 },
        { n: 43, name: "الزخرف", page: 489 }, { n: 44, name: "الدخان", page: 496 },
        { n: 45, name: "الجاثية", page: 499 }, { n: 46, name: "الأحقاف", page: 502 },
        { n: 47, name: "محمد", page: 507 }, { n: 48, name: "الفتح", page: 511 },
        { n: 49, name: "الحجرات", page: 515 }, { n: 50, name: "ق", page: 518 },
        { n: 51, name: "الذاريات", page: 520 }, { n: 52, name: "الطور", page: 523 },
        { n: 53, name: "النجم", page: 526 }, { n: 54, name: "القمر", page: 528 },
        { n: 55, name: "الرحمن", page: 531 }, { n: 56, name: "الواقعة", page: 534 },
        { n: 57, name: "الحديد", page: 537 }, { n: 58, name: "المجادلة", page: 542 },
        { n: 59, name: "الحشر", page: 545 }, { n: 60, name: "الممتحنة", page: 549 },
        { n: 61, name: "الصف", page: 551 }, { n: 62, name: "الجمعة", page: 553 },

        { n: 65, name: "الطلاق", page: 558 }, { n: 66, name: "التحريم", page: 560 },
        { n: 67, name: "الملك", page: 562 }, { n: 68, name: "القلم", page: 564 },
        { n: 69, name: "الحاقة", page: 566 }, { n: 70, name: "المعارج", page: 568 },
        { n: 71, name: "نوح", page: 570 }, { n: 72, name: "الجن", page: 572 },
        { n: 73, name: "المزمل", page: 574 }, { n: 74, name: "المدثر", page: 575 },
        { n: 75, name: "القيامة", page: 577 }, { n: 76, name: "الإنسان", page: 578 },
        { n: 77, name: "المرسلات", page: 580 }, { n: 78, name: "النبأ", page: 582 },
        { n: 79, name: "النازعات", page: 583 }, { n: 80, name: "عبس", page: 585 },
        { n: 81, name: "التكوير", page: 586 }, { n: 82, name: "الانفطار", page: 587 },
        { n: 83, name: "المطففين", page: 587 }, { n: 84, name: "الانشقاق", page: 589 },
        { n: 85, name: "البروج", page: 590 }, { n: 86, name: "الطارق", page: 591 },
        { n: 87, name: "الأعلى", page: 591 }, { n: 88, name: "الغاشية", page: 592 },
        { n: 89, name: "الفجر", page: 593 }, { n: 90, name: "البلد", page: 594 },
        { n: 91, name: "الشمس", page: 595 }, { n: 92, name: "الليل", page: 595 },
        { n: 93, name: "الضحى", page: 596 }, { n: 94, name: "الشرح", page: 596 },
        { n: 95, name: "التين", page: 597 }, { n: 96, name: "العلق", page: 597 },
        { n: 97, name: "القدر", page: 598 }, { n: 98, name: "البينة", page: 598 },
        { n: 99, name: "الزلزلة", page: 599 }, { n: 100, name: "العاديات", page: 599 },
        { n: 101, name: "القارعة", page: 600 }, { n: 102, name: "التكاثر", page: 600 },
        { n: 103, name: "العصر", page: 601 }, { n: 104, name: "الهمزة", page: 601 },
        { n: 105, name: "الفيل", page: 601 }, { n: 106, name: "قريش", page: 602 },
        { n: 107, name: "الماعون", page: 602 }, { n: 108, name: "الكوثر", page: 602 },
        { n: 109, name: "الكافرون", page: 603 }, { n: 110, name: "النصر", page: 603 },
        { n: 111, name: "المسد", page: 603 }, { n: 112, name: "الإخلاص", page: 604 },
        { n: 113, name: "الفلق", page: 604 }, { n: 114, name: "الناس", page: 604 }
      ];

      // State
      let currentPage = parseInt(localStorage.getItem(STORAGE_KEY)) || 1;
      let themeMode = 0;
      let hideTimeout = null;
      let isProgrammaticScroll = false;
      let isHoveringDock = false;

      // Elements
      const scrollContainer = document.getElementById('scrollContainer');
      const pagesFeed = document.getElementById('pagesFeed');
      const pageSlider = document.getElementById('pageSlider');
      const pageInput = document.getElementById('pageInput');
      const bottomBar = document.getElementById('bottomBar');
      const dockContainer = document.getElementById('dockContainer');
      const progressLine = document.getElementById('progressLine');
      const pillPageText = document.getElementById('pillPageText');
      const btnPagePill = document.getElementById('btnPagePill');
      const sliderWrapper = document.getElementById('sliderWrapper');
      const btnFullscreen = document.getElementById('btnFullscreen');
      const btnTheme = document.getElementById('btnTheme');
      const btnIndex = document.getElementById('btnIndex');
      const surahDrawer = document.getElementById('surahDrawer');
      const surahList = document.getElementById('surahList');
      const searchSurah = document.getElementById('searchSurah');

      // 1. Build Feed of 604 Pages
      const fragment = document.createDocumentFragment();
      for (let i = 1; i <= TOTAL_PAGES; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.id = `page-${i}`;
        wrapper.dataset.page = i;

        const img = document.createElement('img');
        img.className = 'quran-page';
        img.alt = `صفحة ${i}`;
        img.dataset.src = getPageUrl(i);

        wrapper.appendChild(img);
        fragment.appendChild(wrapper);
      }
      pagesFeed.appendChild(fragment);

      // 2. High-Performance Lazy Load Observer
      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            if (img.dataset.src) {
              img.src = img.dataset.src;
              delete img.dataset.src;
            }
            observer.unobserve(img);
          }
        });
      }, {
        root: scrollContainer,
        rootMargin: '1200px 0px 1200px 0px'
      });

      document.querySelectorAll('.quran-page').forEach(img => imageObserver.observe(img));

      // Update UI Indicators
      function updateIndicators(p) {
        currentPage = p;
        pageSlider.value = p;
        pageInput.value = p;
        pillPageText.innerText = `ص ${p}`;
        progressLine.style.width = `${(p / TOTAL_PAGES) * 100}%`;
        localStorage.setItem(STORAGE_KEY, p);
      }

      // 3. Current Page Tracking Observer
      const pageTracker = new IntersectionObserver((entries) => {
        if (isProgrammaticScroll) return;
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const pageNum = parseInt(entry.target.dataset.page, 10);
            updateIndicators(pageNum);
          }
        });
      }, {
        root: scrollContainer,
        threshold: 0.35
      });

      document.querySelectorAll('.page-wrapper').forEach(wrapper => pageTracker.observe(wrapper));

      // Scroll to a specific page
      function scrollToPage(p, smooth = true) {
        if (p === 1) {
          isProgrammaticScroll = true;
          updateIndicators(1);
          scrollContainer.scrollTo({
            top: 0,
            behavior: smooth ? 'smooth' : 'instant'
          });
          setTimeout(() => { isProgrammaticScroll = false; }, 600);
          return;
        }

        const target = document.getElementById(`page-${p}`);
        if (!target) return;

        isProgrammaticScroll = true;
        updateIndicators(p);

        const img = target.querySelector('img');
        if (img && img.dataset.src) {
          img.src = img.dataset.src;
          delete img.dataset.src;
        }

        target.scrollIntoView({
          behavior: smooth ? 'smooth' : 'instant',
          block: 'start'
        });

        setTimeout(() => { isProgrammaticScroll = false; }, 600);
      }

      function nextPage() {
        if (currentPage < TOTAL_PAGES) scrollToPage(currentPage + 1);
      }

      function prevPage() {
        if (currentPage > 1) scrollToPage(currentPage - 1);
      }

      // Populate Surah List
      function renderSurahs(filter = '') {
        surahList.innerHTML = '';
        SURAHS
          .filter(s => s.name.includes(filter) || String(s.n).includes(filter))
          .forEach(s => {
            const li = document.createElement('li');
            li.className = 'surah-item';
            li.innerHTML = `
              <span><span class="surah-num">${s.n}.</span> ${s.name}</span>
              <span class="surah-page">ص ${s.page}</span>
            `;
            li.onclick = () => {
              scrollToPage(s.page);
              surahDrawer.classList.remove('open');
            };
            surahList.appendChild(li);
          });
      }
      renderSurahs();

      // Smart Auto-Hide Controls on Scrolling
      function hideUI() {
        if (!isHoveringDock && !surahDrawer.classList.contains('open')) {
          bottomBar.classList.add('hidden');
        }
      }

      function showUI() {
        bottomBar.classList.remove('hidden');
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(hideUI, 2400);
      }

      // Auto-hide when scrolling
      scrollContainer.addEventListener('scroll', () => {
        hideUI();
      }, { passive: true });

      window.addEventListener('mousemove', showUI);
      window.addEventListener('touchstart', showUI);

      // Keep dock visible on mouse hover
      dockContainer.addEventListener('mouseenter', () => {
        isHoveringDock = true;
        clearTimeout(hideTimeout);
      });
      dockContainer.addEventListener('mouseleave', () => {
        isHoveringDock = false;
        showUI();
      });

      // Toggle expandable slider on pill click
      btnPagePill.onclick = () => {
        sliderWrapper.classList.toggle('expanded');
      };

      // Navigation Buttons
      document.getElementById('btnNext').onclick = nextPage;
      document.getElementById('btnPrev').onclick = prevPage;
      pageSlider.oninput = e => scrollToPage(parseInt(e.target.value, 10));
      pageInput.onchange = e => scrollToPage(parseInt(e.target.value, 10));

      // Theme Toggle
      btnTheme.onclick = () => {
        themeMode = (themeMode + 1) % 3;
        document.body.className = '';
        if (themeMode === 1) document.body.classList.add('mode-dark');
        if (themeMode === 2) document.body.classList.add('mode-sepia');
      };

      // Fullscreen
      btnFullscreen.onclick = async () => {
        if (!document.fullscreenElement) {
          try {
            await document.documentElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
              await screen.orientation.lock('landscape').catch(() => {});
            }
          } catch (e) {}
        } else {
          document.exitFullscreen();
        }
      };

      // Surah Drawer
      btnIndex.onclick = () => surahDrawer.classList.toggle('open');
      document.getElementById('btnCloseDrawer').onclick = () => surahDrawer.classList.remove('open');
      searchSurah.oninput = e => renderSurahs(e.target.value.trim());

      // Keyboard navigation
      window.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;

        if (e.code === 'ArrowLeft') nextPage();
        else if (e.code === 'ArrowRight') prevPage();
        else if (e.key.toLowerCase() === 'f') btnFullscreen.click();
        else if (e.key === 'Escape') surahDrawer.classList.remove('open');
      });

      // Restore saved reading position on load
      setTimeout(() => {
        scrollToPage(currentPage, false);
        showUI();
      }, 100);
    })();
  </script>
</body>
</html>
