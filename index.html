<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>القرآن الكريم مع الترجمة الأمهرية — Holy Quran with Amharic Translation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #141822;
      --card-hover-bg: #1a202e;
      --border: rgba(212, 175, 55, 0.35);
      --border-hover: rgba(212, 175, 55, 0.6);
      --accent: #d4af37;
      --accent-hover: #f3cf65;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --page-width: 95vw;
      --page-max-width: 1350px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Reading Tone Filters */
    body.mode-dark { --bg: #050608; }
    body.mode-dark .quran-page { filter: invert(0.92) hue-rotate(180deg) contrast(1.12) brightness(0.92); }
    body.mode-sepia { --bg: #181512; }
    body.mode-sepia .quran-page { filter: sepia(0.4) contrast(1.05) brightness(0.95); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Continuous Vertical Scroll Container */
    #scrollContainer {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
      padding-bottom: 110px;
    }

    /* Sleek Custom Scrollbar */
    #scrollContainer::-webkit-scrollbar,
    .trans-content::-webkit-scrollbar,
    .surah-list::-webkit-scrollbar {
      width: 6px;
    }
    #scrollContainer::-webkit-scrollbar-track,
    .trans-content::-webkit-scrollbar-track,
    .surah-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #scrollContainer::-webkit-scrollbar-thumb,
    .trans-content::-webkit-scrollbar-thumb,
    .surah-list::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.25);
      border-radius: 999px;
    }
    #scrollContainer::-webkit-scrollbar-thumb:hover,
    .trans-content::-webkit-scrollbar-thumb:hover,
    .surah-list::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* Feed Container: Minimized 8px gap between pages */
    #pagesFeed {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 8px;
    }

    /* Wide Quran Page Wrapper */
    .page-wrapper {
      width: var(--page-width);
      max-width: var(--page-max-width);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      content-visibility: auto;
      contain-intrinsic-size: 1000px 1500px;
      scroll-margin-top: 14px;
    }

    .quran-page {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      background-color: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      image-rendering: high-quality;
      min-height: 400px;
    }

    /* Smart & Modern Quran Page Number Overlay Badge */
    .page-number-badge {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 18, 25, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.38);
      border-radius: 9999px;
      padding: 0.26rem 0.9rem;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
      transition: var(--transition);
      letter-spacing: 0.3px;
    }

    .page-wrapper:hover .page-number-badge {
      background: rgba(14, 18, 25, 0.96);
      border-color: var(--accent-hover);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 14px rgba(212, 175, 55, 0.25);
      color: var(--accent-hover);
    }

    .badge-surah {
      font-family: 'Amiri', serif;
      font-size: 0.95rem;
      color: #fff;
    }

    .badge-dot {
      color: rgba(212, 175, 55, 0.6);
      font-size: 0.75rem;
    }

    .badge-ar {
      font-family: 'Amiri', serif;
      font-size: 0.92rem;
      color: var(--accent-hover);
    }

    .badge-en {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      color: var(--text-muted);
      direction: ltr;
    }

    /* Floating Toolbar Container */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 50;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      pointer-events: none;
    }

    .bottom-bar.hidden {
      transform: translateY(120%);
      opacity: 0;
    }

    /* Fixed-Width Solid Dock (Never Expands) */
    .dock-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.35rem 0.75rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85), 0 2px 8px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 0.45rem;
      pointer-events: auto;
      position: relative;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .dock-container:hover {
      border-color: var(--border-hover);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.95), 0 0 18px rgba(212, 175, 55, 0.18);
    }

    /* Micro Progress Bar */
    .progress-line {
      position: absolute;
      bottom: 0;
      left: 14px;
      right: 14px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-hover));
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 6px var(--accent);
    }

    .dock-section {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dock-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 0.15rem;
    }

    /* Buttons */
    .btn {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 0.4rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(212, 175, 55, 0.18);
      color: var(--accent-hover);
    }

    .btn-index {
      font-family: 'Amiri', serif;
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--accent);
      padding: 0.25rem 0.65rem;
    }

    .btn-trans {
      font-family: 'Noto Sans Ethiopic', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
    }

    .btn-icon {
      padding: 0.45rem;
      width: 34px;
      height: 34px;
      justify-content: center;
    }

    /* Fixed Page Pill Button */
    .btn-page-pill {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--accent-hover);
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.84rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-page-pill:hover,
    .btn-page-pill.active {
      background: rgba(212, 175, 55, 0.26);
      border-color: var(--accent);
    }

    .total-pages-label {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.75rem;
      direction: ltr;
    }

    /* Floating Page Scrubber Popover */
    .page-popover {
      background: #141822;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.85rem 1.1rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.7);
      width: 270px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px) scale(0.96);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      position: relative;
    }

    .page-popover.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .page-popover::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background: #141822;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .popover-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
    }

    .popover-input-wrap {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.82rem;
      direction: ltr;
    }

    .popover-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      width: 48px;
      text-align: center;
      border-radius: 6px;
      padding: 0.2rem 0.3rem;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .popover-input:focus {
      outline: 1px solid var(--accent);
    }

    .popover-slider {
      width: 100%;
      accent-color: var(--accent);
      height: 5px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
    }

    /* Common Drawer Styles */
    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      background: #141822;
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0,0,0,0.85);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Right Drawer (Surah Index) */
    .drawer-right {
      right: 0;
      width: 340px;
      border-left: 1px solid var(--border);
      transform: translateX(100%);
    }
    .drawer-right.open { transform: translateX(0); }

    /* Left Drawer (Amharic Translation Panel) */
    .drawer-left {
      left: 0;
      width: min(540px, 94vw);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      direction: ltr;
    }
    .drawer-left.open { transform: translateX(0); }

    .drawer-header {
      padding: 1.1rem 1.25rem 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-title-ar {
      font-family: 'Amiri', serif;
      font-size: 1.3rem;
      color: var(--accent);
    }

    .drawer-title-am {
      font-family: 'Noto Sans Ethiopic', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .drawer-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .drawer-search {
      margin: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
    }

    .drawer-search:focus {
      outline: 1px solid var(--accent);
    }

    .surah-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0.5rem;
    }

    .surah-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .surah-item:hover {
      background: rgba(212, 175, 55, 0.18);
      color: var(--accent-hover);
    }

    .surah-num {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }

    .surah-page {
      font-size: 0.8rem;
      color: var(--accent);
      direction: ltr;
    }

    /* Amharic Translation Content Area */
    .trans-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      user-select: text;
      -webkit-user-select: text;
    }

    .trans-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: var(--transition);
    }

    .trans-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(212, 175, 55, 0.3);
    }

    .ayah-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      background: rgba(212, 175, 55, 0.12);
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      width: fit-content;
    }

    .ayah-arabic {
      font-family: 'Amiri', serif;
      font-size: 1.35rem;
      line-height: 2.1;
      direction: rtl;
      text-align: right;
      color: #fff;
    }

    .ayah-amharic {
      font-family: 'Noto Sans Ethiopic', sans-serif;
      font-size: 1.05rem;
      line-height: 1.75;
      color: #e2e8f0;
      direction: ltr;
      text-align: left;
    }

    .trans-loading, .trans-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
      gap: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      font-family: 'Noto Sans Ethiopic', sans-serif;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Continuous Infinite Vertical Scroll Container -->
  <main id="scrollContainer">
    <div id="pagesFeed"></div>
  </main>

  <!-- Bottom Floating Toolbar -->
  <footer class="bottom-bar" id="bottomBar">
    <!-- Floating Page Scrubber Popover -->
    <div class="page-popover" id="pagePopover">
      <div class="popover-header">
        <span class="popover-title">انتقال إلى صفحة</span>
        <div class="popover-input-wrap">
          <input type="number" class="popover-input" id="popoverInput" min="1" max="604" value="1" />
          <span style="color: var(--text-muted);">/ 604</span>
        </div>
      </div>
      <input type="range" class="popover-slider" id="popoverSlider" min="1" max="604" value="1" dir="ltr" />
    </div>

    <!-- Solid Fixed-Size Dock (Never Expands) -->
    <div class="dock-container" id="dockContainer">
      <div class="progress-line">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <!-- Controls: Surah List, Amharic Translation, Theme, Fullscreen -->
      <div class="dock-section">
        <button class="btn btn-index" id="btnIndex" title="فهرس السور">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h7"></path></svg>
          <span>الفهرس</span>
        </button>

        <button class="btn btn-trans" id="btnTrans" title="የአማርኛ ትርጉም (ሳዲቅ እና ሳኒ)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path><path d="M8 7h8"></path><path d="M8 11h6"></path></svg>
          <span>ትርጉም</span>
        </button>

        <button class="btn btn-icon" id="btnTheme" title="تغيير النمط (عادي / ليلي / قديم)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>

        <button class="btn btn-icon" id="btnFullscreen" title="شاشة كاملة (F)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        </button>
      </div>

      <div class="dock-divider"></div>

      <!-- Navigation & Fixed Page Pill Button -->
      <div class="dock-section">
        <button class="btn btn-icon" id="btnNext" title="الصفحة التالية">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>

        <button class="btn-page-pill" id="btnPagePill" title="انقر لفتح شريط الانتقال">
          <span id="pillPageText">ص 1</span>
          <span class="total-pages-label">/ 604</span>
        </button>

        <button class="btn btn-icon" id="btnPrev" title="الصفحة السابقة">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- Surah Quick-Picker Drawer (Right) -->
  <aside class="drawer drawer-right" id="surahDrawer">
    <div class="drawer-header">
      <span class="drawer-title-ar">سور القرآن الكريم</span>
      <button class="btn btn-icon" id="btnCloseDrawer">✕</button>
    </div>
    <input type="text" class="drawer-search" id="searchSurah" placeholder="ابحث عن سورة..." />
    <ul class="surah-list" id="surahList"></ul>
  </aside>

  <!-- Amharic Translation Drawer Panel (Left) -->
  <aside class="drawer drawer-left" id="transDrawer">
    <div class="drawer-header">
      <div>
        <div class="drawer-title-am">
          <span>የቁርኣን ትርጉም</span>
          <span id="transPageBadge" style="font-size: 0.8rem; color: var(--accent); background: rgba(212,175,55,0.15); padding: 0.15rem 0.5rem; border-radius: 999px;">ገጽ 1</span>
        </div>
        <span class="drawer-subtitle">ሳዲቅ እና ሳኒ ሐቢብ (Muhammed Sadiq & Sani)</span>
      </div>
      <button class="btn btn-icon" id="btnCloseTrans">✕</button>
    </div>
    <div class="trans-content" id="transContent">
      <div class="trans-loading">
        <div class="spinner"></div>
        <span>ትርጉሙን በመጫን ላይ...</span>
      </div>
    </div>
  </aside>

  <script>
    (function () {
      const TOTAL_PAGES = 604;
      const STORAGE_KEY = 'oxpc3_quran_page';

      function getPageUrl(page) {
        return `./img/page${String(page).padStart(3, '0')}.webp`;
      }

      function toArabicDigits(num) {
        return String(num).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
      }

      const SURAHS = [
        { n: 1, name: "الفاتحة", page: 1 }, { n: 2, name: "البقرة", page: 2 },
        { n: 3, name: "آل عمران", page: 50 }, { n: 4, name: "النساء", page: 77 },
        { n: 5, name: "المائدة", page: 106 }, { n: 6, name: "الأنعام", page: 128 },

        { n: 101, name: "القارعة", page: 600 }, { n: 102, name: "التكاثر", page: 600 },
        { n: 103, name: "العصر", page: 601 }, { n: 104, name: "الهمزة", page: 601 },
        { n: 105, name: "الفيل", page: 601 }, { n: 106, name: "قريش", page: 602 },
        { n: 107, name: "الماعون", page: 602 }, { n: 108, name: "الكوثر", page: 602 },
        { n: 109, name: "الكافرون", page: 603 }, { n: 110, name: "النصر", page: 603 },
        { n: 111, name: "المسد", page: 603 }, { n: 112, name: "الإخلاص", page: 604 },
        { n: 113, name: "الفلق", page: 604 }, { n: 114, name: "الناس", page: 604 }
      ];

      function getSurahNameForPage(p) {
        let surah = SURAHS[0];
        for (let i = 0; i < SURAHS.length; i++) {
          if (SURAHS[i].page <= p) surah = SURAHS[i];
          else break;
        }
        return surah.name;
      }

      // State
      let currentPage = parseInt(localStorage.getItem(STORAGE_KEY)) || 1;
      let themeMode = 0;
      let hideTimeout = null;
      let isProgrammaticScroll = false;
      let isHoveringDock = false;
      const transCache = new Map();

      // Elements
      const scrollContainer = document.getElementById('scrollContainer');
      const pagesFeed = document.getElementById('pagesFeed');
      const bottomBar = document.getElementById('bottomBar');
      const dockContainer = document.getElementById('dockContainer');
      const progressFill = document.getElementById('progressFill');
      const pillPageText = document.getElementById('pillPageText');
      const btnPagePill = document.getElementById('btnPagePill');
      const pagePopover = document.getElementById('pagePopover');
      const popoverSlider = document.getElementById('popoverSlider');
      const popoverInput = document.getElementById('popoverInput');
      const btnFullscreen = document.getElementById('btnFullscreen');
      const btnTheme = document.getElementById('btnTheme');
      const btnIndex = document.getElementById('btnIndex');
      const btnTrans = document.getElementById('btnTrans');
      const surahDrawer = document.getElementById('surahDrawer');
      const transDrawer = document.getElementById('transDrawer');
      const transContent = document.getElementById('transContent');
      const transPageBadge = document.getElementById('transPageBadge');
      const surahList = document.getElementById('surahList');
      const searchSurah = document.getElementById('searchSurah');

      // 1. Build Feed of 604 Pages with Smart Page Badges
      const fragment = document.createDocumentFragment();
      for (let i = 1; i <= TOTAL_PAGES; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.id = `page-${i}`;
        wrapper.dataset.page = i;

        const img = document.createElement('img');
        img.className = 'quran-page';
        img.alt = `صفحة ${i}`;
        img.dataset.src = getPageUrl(i);

        // Smart Modern Quran Page Number Badge
        const badge = document.createElement('div');
        badge.className = 'page-number-badge';
        badge.innerHTML = `
          <span class="badge-surah">${getSurahNameForPage(i)}</span>
          <span class="badge-dot">•</span>
          <span class="badge-ar">ص ${toArabicDigits(i)}</span>
          <span class="badge-dot">•</span>
          <span class="badge-en">${i}</span>
        `;

        wrapper.appendChild(img);
        wrapper.appendChild(badge);
        fragment.appendChild(wrapper);
      }
      pagesFeed.appendChild(fragment);

      // 2. Lazy Load Observer
      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            if (img.dataset.src) {
              img.src = img.dataset.src;
              delete img.dataset.src;
            }
            observer.unobserve(img);
          }
        });
      }, {
        root: scrollContainer,
        rootMargin: '1200px 0px 1200px 0px'
      });

      document.querySelectorAll('.quran-page').forEach(img => imageObserver.observe(img));

      // Provider 1: Quran.com API (ID 87 = Sadiq & Sani Habib)
      async function fetchFromQuranCom(page) {
        const url = `https://api.quran.com/api/v4/verses/by_page/${page}?translations=87&fields=text_uthmani`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Quran.com request failed');
        const data = await res.json();
        if (!data.verses || data.verses.length === 0) throw new Error('No verses');

        return data.verses.map(v => {
          const parts = v.verse_key.split(':');
          const suraNum = parseInt(parts[0], 10);
          const ayaNum = parts[1];
          const sInfo = SURAHS.find(s => s.n === suraNum);
          const rawTrans = (v.translations && v.translations[0]) ? v.translations[0].text : '';
          const cleanTrans = rawTrans.replace(/<[^>]*>/g, '').trim();

          return {
            surahName: sInfo ? sInfo.name : `سورة ${suraNum}`,
            surahEnglish: sInfo ? sInfo.name : `Surah ${suraNum}`,
            numberInSurah: ayaNum,
            arabicText: v.text_uthmani || '',
            amharicText: cleanTrans
          };
        });
      }

      // Provider 2: QuranEnc.com API
      async function fetchFromQuranEnc(page) {
        const url = `https://quranenc.com/api/v1/translation/page/amharic_sadiq/${page}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('QuranEnc request failed');
        const data = await res.json();
        if (!data.result || data.result.length === 0) throw new Error('No result');

        return data.result.map(v => {
          const suraNum = parseInt(v.sura, 10);
          const sInfo = SURAHS.find(s => s.n === suraNum);
          return {
            surahName: sInfo ? sInfo.name : `سورة ${suraNum}`,
            surahEnglish: sInfo ? sInfo.name : `Surah ${suraNum}`,
            numberInSurah: v.aya,
            arabicText: v.arabic_text || '',
            amharicText: (v.translation || '').replace(/<[^>]*>/g, '').trim()
          };
        });
      }

      // Provider 3: AlQuran Cloud API
      async function fetchFromAlQuranCloud(page) {
        const url = `https://api.alquran.cloud/v1/page/${page}/editions/quran-uthmani,am.sadiq`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('AlQuran Cloud request failed');
        const data = await res.json();
        if (data.code !== 200 || !data.data || data.data.length < 2) throw new Error('Invalid data');

        const arAyahs = data.data[0].ayahs;
        const amAyahs = data.data[1].ayahs;
        return arAyahs.map((ar, idx) => ({
          surahName: ar.surah.name,
          surahEnglish: ar.surah.englishName,
          numberInSurah: ar.numberInSurah,
          arabicText: ar.text,
          amharicText: amAyahs[idx] ? amAyahs[idx].text.replace(/<[^>]*>/g, '').trim() : ''
        }));
      }

      // Multi-Source Translation Loader
      async function loadTranslation(page) {
        transPageBadge.innerText = `ገጽ ${page}`;

        if (transCache.has(page)) {
          renderTranslation(transCache.get(page));
          return;
        }

        transContent.innerHTML = `
          <div class="trans-loading">
            <div class="spinner"></div>
            <span>የገጽ ${page} ትርጉም በመጫን ላይ...</span>
          </div>`;

        const providers = [fetchFromQuranCom, fetchFromQuranEnc, fetchFromAlQuranCloud];
        let combined = null;

        for (const fetcher of providers) {
          try {
            combined = await fetcher(page);
            if (combined && combined.length > 0) break;
          } catch (e) {
            console.warn('Provider failed, switching to backup...', e);
          }
        }

        if (combined && combined.length > 0) {
          transCache.set(page, combined);
          renderTranslation(combined);
        } else {
          transContent.innerHTML = `
            <div class="trans-error">
              <span>⚠️ ትርጉሙን መጫን አልተቻለም።</span>
              <span style="font-size: 0.8rem;">እባክዎ የበይነመረብ (Internet) ግንኙነትዎን ያረጋግጡ።</span>
              <button class="btn" style="border: 1px solid var(--border); margin-top: 0.5rem;" onclick="window.retryTranslation(${page})">እንደገና ሞክር</button>
            </div>`;
        }
      }

      window.retryTranslation = loadTranslation;

      function renderTranslation(ayahs) {
        if (!ayahs || ayahs.length === 0) {
          transContent.innerHTML = '<div class="trans-error">ምንም አያህ አልተገኘም።</div>';
          return;
        }

        transContent.innerHTML = '';
        ayahs.forEach(ayah => {
          const card = document.createElement('div');
          card.className = 'trans-card';
          card.innerHTML = `
            <div class="ayah-badge">
              <span>${ayah.surahEnglish} (${ayah.surahName})</span> : <span>አያህ ${ayah.numberInSurah}</span>
            </div>
            <div class="ayah-arabic">${ayah.arabicText}</div>
            <div class="ayah-amharic">${ayah.amharicText}</div>
          `;
          transContent.appendChild(card);
        });
      }

      // Update UI Indicators
      function updateIndicators(p) {
        currentPage = p;
        popoverSlider.value = p;
        popoverInput.value = p;
        pillPageText.innerText = `ص ${p}`;
        progressFill.style.width = `${(p / TOTAL_PAGES) * 100}%`;
        localStorage.setItem(STORAGE_KEY, p);

        if (transDrawer.classList.contains('open')) {
          loadTranslation(p);
        }
      }

      // 3. Current Page Tracking Observer
      const pageTracker = new IntersectionObserver((entries) => {
        if (isProgrammaticScroll) return;
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const pageNum = parseInt(entry.target.dataset.page, 10);
            updateIndicators(pageNum);
          }
        });
      }, {
        root: scrollContainer,
        threshold: 0.35
      });

      document.querySelectorAll('.page-wrapper').forEach(wrapper => pageTracker.observe(wrapper));

      // Scroll to a specific page
      function scrollToPage(p, smooth = true) {
        if (p === 1) {
          isProgrammaticScroll = true;
          updateIndicators(1);
          scrollContainer.scrollTo({
            top: 0,
            behavior: smooth ? 'smooth' : 'instant'
          });
          setTimeout(() => { isProgrammaticScroll = false; }, 600);
          return;
        }

        const target = document.getElementById(`page-${p}`);
        if (!target) return;

        isProgrammaticScroll = true;
        updateIndicators(p);

        const img = target.querySelector('img');
        if (img && img.dataset.src) {
          img.src = img.dataset.src;
          delete img.dataset.src;
        }

        target.scrollIntoView({
          behavior: smooth ? 'smooth' : 'instant',
          block: 'start'
        });

        setTimeout(() => { isProgrammaticScroll = false; }, 600);
      }

      function nextPage() {
        if (currentPage < TOTAL_PAGES) scrollToPage(currentPage + 1);
      }

      function prevPage() {
        if (currentPage > 1) scrollToPage(currentPage - 1);
      }

      // Populate Surah List
      function renderSurahs(filter = '') {
        surahList.innerHTML = '';
        SURAHS
          .filter(s => s.name.includes(filter) || String(s.n).includes(filter))
          .forEach(s => {
            const li = document.createElement('li');
            li.className = 'surah-item';
            li.innerHTML = `
              <span><span class="surah-num">${s.n}.</span> ${s.name}</span>
              <span class="surah-page">ص ${s.page}</span>
            `;
            li.onclick = () => {
              scrollToPage(s.page);
              surahDrawer.classList.remove('open');
            };
            surahList.appendChild(li);
          });
      }
      renderSurahs();

      // Smart Auto-Hide Controls on Scrolling
      function hideUI() {
        if (!isHoveringDock && !surahDrawer.classList.contains('open') && !transDrawer.classList.contains('open') && !pagePopover.classList.contains('open')) {
          bottomBar.classList.add('hidden');
        }
      }

      function showUI() {
        bottomBar.classList.remove('hidden');
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(hideUI, 2400);
      }

      // Auto-hide when scrolling
      scrollContainer.addEventListener('scroll', () => {
        pagePopover.classList.remove('open');
        btnPagePill.classList.remove('active');
        hideUI();
      }, { passive: true });

      window.addEventListener('mousemove', showUI);
      window.addEventListener('touchstart', showUI);

      // Keep dock visible on mouse hover
      dockContainer.addEventListener('mouseenter', () => {
        isHoveringDock = true;
        clearTimeout(hideTimeout);
      });
      dockContainer.addEventListener('mouseleave', () => {
        isHoveringDock = false;
        showUI();
      });

      // Toggle Floating Page Scrubber Popover
      btnPagePill.onclick = (e) => {
        e.stopPropagation();
        const isOpen = pagePopover.classList.toggle('open');
        btnPagePill.classList.toggle('active', isOpen);
      };

      // Close popover when clicking outside
      document.addEventListener('click', (e) => {
        if (!pagePopover.contains(e.target) && !btnPagePill.contains(e.target)) {
          pagePopover.classList.remove('open');
          btnPagePill.classList.remove('active');
        }
      });

      // Popover Events
      popoverSlider.oninput = e => scrollToPage(parseInt(e.target.value, 10));
      popoverInput.onchange = e => scrollToPage(parseInt(e.target.value, 10));

      // Navigation Buttons
      document.getElementById('btnNext').onclick = nextPage;
      document.getElementById('btnPrev').onclick = prevPage;

      // Theme Toggle
      btnTheme.onclick = () => {
        themeMode = (themeMode + 1) % 3;
        document.body.className = '';
        if (themeMode === 1) document.body.classList.add('mode-dark');
        if (themeMode === 2) document.body.classList.add('mode-sepia');
      };

      // Fullscreen
      btnFullscreen.onclick = async () => {
        if (!document.fullscreenElement) {
          try {
            await document.documentElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
              await screen.orientation.lock('landscape').catch(() => {});
            }
          } catch (e) {}
        } else {
          document.exitFullscreen();
        }
      };

      // Surah Drawer Toggle
      btnIndex.onclick = () => {
        transDrawer.classList.remove('open');
        surahDrawer.classList.toggle('open');
      };
      document.getElementById('btnCloseDrawer').onclick = () => surahDrawer.classList.remove('open');
      searchSurah.oninput = e => renderSurahs(e.target.value.trim());

      // Amharic Translation Drawer Toggle
      btnTrans.onclick = () => {
        surahDrawer.classList.remove('open');
        const isOpen = transDrawer.classList.toggle('open');
        if (isOpen) {
          loadTranslation(currentPage);
        }
      };
      document.getElementById('btnCloseTrans').onclick = () => transDrawer.classList.remove('open');

      // Keyboard navigation
      window.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;

        if (e.code === 'ArrowLeft') nextPage();
        else if (e.code === 'ArrowRight') prevPage();
        else if (e.key.toLowerCase() === 'f') btnFullscreen.click();
        else if (e.key === 'Escape') {
          surahDrawer.classList.remove('open');
          transDrawer.classList.remove('open');
          pagePopover.classList.remove('open');
          btnPagePill.classList.remove('active');
        }
      });

      // Restore saved reading position on load
      setTimeout(() => {
        scrollToPage(currentPage, false);
        showUI();
      }, 100);
    })();
  </script>
